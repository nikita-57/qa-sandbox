services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      - SQLALCHEMY_DATABASE_URL=sqlite:////app/db/sandbox.db
    volumes:
      - ./backend/db:/app/db
    networks:
      - appnet

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    depends_on:
      - backend
    networks:
      - appnet

  nginx:
    image: nginx:stable-alpine
    container_name: qalab-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx-stage.conf:/etc/nginx/conf.d/default.conf
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    depends_on:
      - frontend
      - backend
    networks:
      - appnet

networks:
  appnet:
    driver: bridge
