version: "3.9"

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      - SQLALCHEMY_DATABASE_URL=sqlite:////app/db/sandbox.db
    volumes:
      - ./backend/db:/app/db
    networks:
      - appnet

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    depends_on:
      - backend
    networks:
      - appnet

  nginx:
    image: nginx:stable-alpine
    container_name: qalab-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx-stage.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - frontend
      - backend
    networks:
      - appnet

networks:
  appnet:
    driver: bridge
